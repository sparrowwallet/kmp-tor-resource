name: CI

on:
  workflow_dispatch:
  push:

jobs:
  linux-libc-x86_64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      OUT: external/build/out/tor-gpl/linux-libc/x86_64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The build-env images are pulled by the digests in build-env/digests.
      - name: Log In To GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: ./external/task.sh build:linux-libc:x86_64

      - name: Record Hashes
        run: |
          {
            echo "### linux-libc x86_64 output"
            echo '```'
            (cd "$OUT" && sha256sum tor libtor.so)
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check glibc
        run: ./.github/workflows/glibc_check.sh 2.23 "$OUT/tor" "$OUT/libtor.so"

      - name: Run tor --version On Ubuntu 20.04
        run: docker run --rm -v "$GITHUB_WORKSPACE/$OUT:/tor:ro" ubuntu:20.04 /tor/tor --version

      - name: Upload Build Logs And Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-libc-x86_64
          path: |
            external/build/stage/linux-libc/x86_64/build.sh
            external/build/stage/linux-libc/x86_64/*/logs/**
            external/build/out/tor-gpl/linux-libc/x86_64/**
          if-no-files-found: warn
