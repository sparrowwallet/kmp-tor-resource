name: CI

on:
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize the macOS output, and upload its detached signatures
        type: boolean
        default: false
  push:

jobs:
  build:
    name: build ${{ matrix.target }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-libc, arch: x86_64,  files: tor libtor.so }
          - { target: linux-libc, arch: aarch64, files: tor libtor.so }
          - { target: macos-lts,  arch: aarch64, files: tor libtor.dylib }
          - { target: macos-lts,  arch: x86_64,  files: tor libtor.dylib }
          - { target: mingw,      arch: x86_64,  files: tor.exe tor.dll }
    env:
      OUT: external/build/out/tor-gpl/${{ matrix.target }}/${{ matrix.arch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The build-env images are pulled by the digests in build-env/digests.
      # base.macos-lts and macos-lts.* are private packages that grant this repo access.
      - name: Log In To GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: ./external/task.sh build:${{ matrix.target }}:${{ matrix.arch }}

      - name: Record Hashes
        run: |
          {
            echo "### ${{ matrix.target }} ${{ matrix.arch }} output"
            echo '```'
            (cd "$OUT" && sha256sum ${{ matrix.files }})
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check glibc
        if: matrix.target == 'linux-libc'
        run: ./.github/workflows/glibc_check.sh 2.23 "$OUT/tor" "$OUT/libtor.so"

      # Unsigned. macOS and MinGW output isn't signed, smoke tested or packaged yet.
      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ env.OUT }}/
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.arch }}-logs
          path: |
            external/build/stage/${{ matrix.target }}/${{ matrix.arch }}/build.sh
            external/build/stage/${{ matrix.target }}/${{ matrix.arch }}/*/logs/**
          if-no-files-found: warn

  # Runs the build output on the glibc floor, natively on each architecture (no QEMU).
  linux-smoke:
    name: smoke linux-libc-${{ matrix.arch }}
    needs: build
    # Also runs if another target failed; the download fails if this architecture's build did.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - name: Download Output
        uses: actions/download-artifact@v4
        with:
          name: linux-libc-${{ matrix.arch }}
          path: tor-out

      # Artifacts don't keep file modes.
      - name: Run tor --version On Ubuntu 20.04
        run: |
          chmod +x tor-out/tor
          docker run --rm -v "$PWD/tor-out:/tor:ro" ubuntu:20.04 /tor/tor --version

  # Checks the minimum OS and runs the unsigned build output, natively on each architecture.
  macos-smoke:
    name: smoke macos-lts-${{ matrix.arch }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: macos-15 }
          - { arch: x86_64,  runner: macos-15-intel }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Output
        uses: actions/download-artifact@v4
        with:
          name: macos-lts-${{ matrix.arch }}
          path: tor-out

      - name: Check Minimum macOS Version
        run: ./.github/workflows/macos_min_check.sh ${{ matrix.arch }} tor-out/tor tor-out/libtor.dylib

      # The build links with -no_adhoc_codesign, so the output is fully unsigned. Apple Silicon
      # won't run unsigned arm64 code, so the arm64 test runs an ad-hoc signed copy (the
      # Developer ID signing comes in step 4). Intel runs the output as built.
      - name: Run tor --version
        run: |
          chmod +x tor-out/tor
          dir=tor-out
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            dir=tor-adhoc
            cp -R tor-out "$dir"
            codesign --force -s - "$dir/libtor.dylib" "$dir/tor"
          fi
          "$dir/tor" --version

  # Runs the unsigned build output as at runtime: tor.dll and tor.exe.local next to tor.exe.
  windows-smoke:
    name: smoke mingw-x86_64
    needs: build
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download Output
        uses: actions/download-artifact@v4
        with:
          name: mingw-x86_64
          path: tor-out

      # Same content as the tor.exe.local that external/task.sh package:mingw writes.
      - name: Run tor --version
        shell: bash
        run: |
          echo "# https://learn.microsoft.com/en-us/windows/win32/dlls/dynamic-link-library-redirection#how-to-redirect-dlls-for-unpackaged-apps" > tor-out/tor.exe.local
          ./tor-out/tor.exe --version

  # Signs the macOS output with Sparrow's Developer ID (hardened runtime), notarizes it, and uploads the
  # signed binaries. Run by hand (workflow_dispatch with sign_macos), only when the macOS binaries change.
  #
  # This is the only job with the signing secrets. It doesn't check out the repository and runs no Gradle,
  # Java or code from this repo's build.
  # No action runs while the keychain exists: artifacts are downloaded before the keychain is created,
  # and uploaded after it's deleted. Actions are pinned by commit SHA.
  #
  # Runs on Intel: codesign and notarytool sign the arm64 binaries the same way there, and GitHub's
  # macOS arm64 runners repeatedly weren't available (jobs cancelled after 15 minutes unassigned).
  # The signed arm64 run is the separate macos-signed-arm64 job, so it doesn't gate the signatures.
  sign-macos:
    name: sign macos-lts
    needs: [build, macos-smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_macos }}
    runs-on: macos-15-intel
    # Artifacts of this run need no token permissions.
    permissions: {}
    env:
      UNSIGNED: ${{ github.workspace }}/unsigned
      SIGNED: ${{ github.workspace }}/signed
    steps:
      - name: Download Output aarch64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-lts-aarch64
          path: unsigned/aarch64

      - name: Download Output x86_64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-lts-x86_64
          path: unsigned/x86_64

      # As in Sparrow's codesign-macos action, plus -x: the private key is imported non-extractable,
      # so it can be used for signing but not exported from the keychain.
      - name: Set Up Signing Keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          # Recorded first, so the delete step finds the keychain even if this step fails part way.
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          P12="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$P12"' EXIT
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -x
          rm -f "$P12"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          # The Developer ID Application identity of the notarization team. Listed as valid only if the
          # private key was imported with it; the Sign step is what proves codesign can use it.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application: .*($TEAM_ID)\"" | head -n 1 | awk '{ print $2 }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No valid 'Developer ID Application' identity for team $TEAM_ID in MACOS_CERTIFICATE"
            exit 1
          fi
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # --force replaces the linker's ad-hoc signature on the arm64 tor (next step 3).
      # libtor.dylib and tor must be signed by the same team: hardened runtime's library validation.
      - name: Sign
        env:
          TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          cp -R "$UNSIGNED" "$SIGNED"
          for arch in aarch64 x86_64; do
            for file in libtor.dylib tor; do
              codesign --force --options runtime --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "$SIGNED/$arch/$file"
              codesign --verify --strict --verbose=2 "$SIGNED/$arch/$file"
              info="$(codesign --display --verbose=2 "$SIGNED/$arch/$file" 2>&1)"
              echo "$info" | grep -E '^(Identifier|Format|CodeDirectory|TeamIdentifier|Timestamp)'
              echo "$info" | grep -qx "TeamIdentifier=$TEAM_ID" || { echo "::error::$arch/$file: wrong team"; exit 1; }
              echo "$info" | grep -q 'flags=.*(runtime)' || { echo "::error::$arch/$file: no hardened runtime"; exit 1; }
            done
          done

      # Right after signing, whether or not it succeeded, so the keychain is gone before anything else runs.
      - name: Delete Signing Keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"

      # A zip of the bare binaries: notarization records every signature in it, and the detached
      # signatures don't depend on stapling (which can't be applied to a bare Mach-O file anyway).
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
        run: |
          ditto -c -k --keepParent "$SIGNED" "$RUNNER_TEMP/tor-macos.zip"
          xcrun notarytool submit "$RUNNER_TEMP/tor-macos.zip" --wait --timeout 30m --output-format json \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" > notary-result.json
          cat notary-result.json
          id="$(jq -r '.id' notary-result.json)"
          xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" notary-log.json
          cat notary-log.json
          if [ "$(jq -r '.status' notary-result.json)" != "Accepted" ]; then
            echo "::error::Notarization status: $(jq -r '.status' notary-result.json)"
            exit 1
          fi
          if [ "$(jq '.issues // [] | length' notary-log.json)" != "0" ]; then
            echo "::error::Notarization log has issues"
            exit 1
          fi

      - name: Upload Signed Output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-lts-signed
          path: signed/
          if-no-files-found: error

      - name: Upload Notarization Log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-lts-notarization
          path: |
            notary-result.json
            notary-log.json
          if-no-files-found: ignore

  # No secrets. Runs the signed arm64 output as built (no ad-hoc copy) on Apple Silicon: library
  # validation between the signed tor and libtor.dylib. Doesn't gate the signatures; if no arm64
  # runner is available, rerun this job on its own later.
  macos-signed-arm64:
    name: smoke signed macos-lts-aarch64
    needs: sign-macos
    runs-on: macos-15
    permissions: {}
    steps:
      - name: Download Signed Output
        uses: actions/download-artifact@v4
        with:
          name: macos-lts-signed
          path: signed

      # Artifacts don't keep file modes.
      - name: Run Signed tor --version
        run: |
          chmod +x signed/aarch64/tor
          signed/aarch64/tor --version

  # No secrets. Runs the signed x86_64 output on Intel (library validation between the signed tor and
  # libtor.dylib; sign-macos runs arm64), then creates the detached signatures with diff-cli (Gradle) and
  # uploads them to commit under external/codesign/tor-gpl/macos-lts/<arch>/.
  macos-signatures:
    name: signatures macos-lts
    needs: sign-macos
    runs-on: macos-15-intel
    permissions:
      contents: read
    env:
      UNSIGNED: ${{ github.workspace }}/unsigned
      SIGNED: ${{ github.workspace }}/signed
      SIGNATURES: ${{ github.workspace }}/external/codesign/tor-gpl/macos-lts
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Output aarch64
        uses: actions/download-artifact@v4
        with:
          name: macos-lts-aarch64
          path: unsigned/aarch64

      - name: Download Output x86_64
        uses: actions/download-artifact@v4
        with:
          name: macos-lts-x86_64
          path: unsigned/x86_64

      - name: Download Signed Output
        uses: actions/download-artifact@v4
        with:
          name: macos-lts-signed
          path: signed

      # Artifacts don't keep file modes.
      - name: Run Signed tor --version
        run: |
          chmod +x "$SIGNED/x86_64/tor"
          "$SIGNED/x86_64/tor" --version

      # For ./tooling diff-cli (Gradle)
      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Detached Signatures
        run: |
          for arch in aarch64 x86_64; do
            mkdir -p "$SIGNATURES/$arch"
            for file in libtor.dylib tor; do
              rm -f "$SIGNATURES/$arch/$file.signature"
              ./tooling diff-cli create --diff-ext-name .signature \
                "$UNSIGNED/$arch/$file" "$SIGNED/$arch/$file" "$SIGNATURES/$arch"
            done
          done

      # Each signature must turn the unsigned file into the signed one, byte for byte.
      - name: Check Detached Signatures
        run: |
          check="$RUNNER_TEMP/check"
          for arch in aarch64 x86_64; do
            for file in libtor.dylib tor; do
              rm -rf "$check" && mkdir -p "$check"
              cp "$UNSIGNED/$arch/$file" "$check/$file"
              ./tooling diff-cli apply "$SIGNATURES/$arch/$file.signature" "$check/$file"
              cmp "$check/$file" "$SIGNED/$arch/$file"
              echo "$arch/$file.signature OK"
            done
          done
          {
            echo "### macOS detached signatures"
            echo '```'
            (cd "$UNSIGNED" && shasum -a 256 aarch64/libtor.dylib aarch64/tor x86_64/libtor.dylib x86_64/tor | sed 's/^/unsigned /')
            (cd "$SIGNED" && shasum -a 256 aarch64/libtor.dylib aarch64/tor x86_64/libtor.dylib x86_64/tor | sed 's/^/signed   /')
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Detached Signatures
        uses: actions/upload-artifact@v4
        with:
          name: macos-lts-signatures
          path: external/codesign/tor-gpl/macos-lts/
          if-no-files-found: error

  # No secrets. Applies the committed Windows detached signatures (made locally with Jsign; next step 5)
  # to this run's unsigned MinGW output. diff-cli refuses a signature whose recorded unsigned hash
  # doesn't match, so this also checks the signatures were made from the bytes CI builds.
  # Skipped (with a notice) while no signatures are committed.
  mingw-signed:
    name: apply signatures mingw-x86_64
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      present: ${{ steps.present.outputs.present }}
    env:
      SIGNATURES: external/codesign/tor-gpl/mingw/x86_64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check For Signatures
        id: present
        run: |
          if [ -f "$SIGNATURES/tor.exe.signature" ] && [ -f "$SIGNATURES/tor.dll.signature" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ -e "$SIGNATURES" ]; then
            echo "::error::$SIGNATURES must hold both tor.exe.signature and tor.dll.signature"
            exit 1
          else
            echo "::notice::No Windows signatures committed yet; skipping the signed Windows check"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Output
        if: steps.present.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mingw-x86_64
          path: signed

      # For ./tooling diff-cli (Gradle)
      - name: Set Up JDK
        if: steps.present.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Apply Signatures
        if: steps.present.outputs.present == 'true'
        run: |
          for file in tor.dll tor.exe; do
            ./tooling diff-cli apply "$PWD/$SIGNATURES/$file.signature" "$PWD/signed/$file"
          done
          {
            echo "### mingw x86_64 signed output"
            echo '```'
            (cd signed && sha256sum tor.dll tor.exe)
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Signed Output
        if: steps.present.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mingw-x86_64-signed
          path: signed/
          if-no-files-found: error

  # Checks the signed Windows output on Windows itself: both files must have a valid, timestamped
  # Authenticode signature, and the signed tor.exe must run with the signed tor.dll.
  windows-signed-smoke:
    name: smoke signed mingw-x86_64
    needs: mingw-signed
    if: needs.mingw-signed.outputs.present == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download Signed Output
        uses: actions/download-artifact@v4
        with:
          name: mingw-x86_64-signed
          path: tor-out

      - name: Check Authenticode Signatures
        shell: pwsh
        run: |
          $failed = $false
          "### mingw x86_64 Authenticode signatures" >> $env:GITHUB_STEP_SUMMARY
          "| File | Status | Signer | Timestamped by |" >> $env:GITHUB_STEP_SUMMARY
          "| --- | --- | --- | --- |" >> $env:GITHUB_STEP_SUMMARY
          foreach ($file in 'tor.dll', 'tor.exe') {
            $sig = Get-AuthenticodeSignature -FilePath "tor-out\$file"
            Write-Output "${file}: $($sig.Status) | signer: $($sig.SignerCertificate.Subject) | timestamped by: $($sig.TimeStamperCertificate.Subject)"
            "| ``$file`` | $($sig.Status) | $($sig.SignerCertificate.Subject) | $($sig.TimeStamperCertificate.Subject) |" >> $env:GITHUB_STEP_SUMMARY
            if ($sig.Status -ne 'Valid') {
              Write-Output "::error::${file}: Authenticode status $($sig.Status): $($sig.StatusMessage)"
              $failed = $true
            }
            if ($null -eq $sig.TimeStamperCertificate) {
              Write-Output "::error::${file}: signature has no timestamp"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # Same content as the tor.exe.local that external/task.sh package:mingw writes.
      - name: Run Signed tor --version
        shell: bash
        run: |
          echo "# https://learn.microsoft.com/en-us/windows/win32/dlls/dynamic-link-library-redirection#how-to-redirect-dlls-for-unpackaged-apps" > tor-out/tor.exe.local
          ./tor-out/tor.exe --version

  # No secrets. Packages this run's output for all five targets as a release does: gzip in the pinned
  # build-env base image, with the committed macOS and Windows detached signatures applied. It then
  # builds the JVM jars and runs the JVM tests against the packaged resources; test-linux runs the
  # packaged tor. Fails if any resource doesn't match its validation hash in build-logic: on a mismatch
  # Gradle otherwise falls back to the mock resources without failing.
  package:
    name: package and validate
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Packaging gzips inside build-env.base, pulled by its digest in build-env/digests.
      - name: Log In To GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Download Output
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place Output
        run: |
          for t in linux-libc/aarch64 linux-libc/x86_64 macos-lts/aarch64 macos-lts/x86_64 mingw/x86_64; do
            name="${t%%/*}-${t##*/}"
            if [ ! -d "artifacts/$name" ]; then echo "::error::Missing artifact $name"; exit 1; fi
            mkdir -p "external/build/out/tor-gpl/$t"
            cp -R "artifacts/$name/." "external/build/out/tor-gpl/$t/"
          done
          find external/build/out -type f | sort

      # JDK 11 for the module-info compile (a Gradle toolchain), JDK 21 to run Gradle.
      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            21

      - name: Package
        run: ./external/task.sh package:all

      - name: Build Jars And Run JVM Tests
        run: |
          rm -rf library/*/build/reports/resource-validation
          ./gradlew -PKMP_TARGETS=JVM -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64 --no-build-cache \
            :library:resource-exec-tor-gpl:jvmJar :library:resource-lib-tor-gpl:jvmJar :library:resource-geoip:jvmJar \
            :library:resource-exec-tor-gpl:jvmTest :library:resource-geoip:jvmTest :test-linux:jvmTest

      # Every report must exist (so validation ran) and be empty (so every hash matched).
      - name: Check Validation Reports
        run: |
          fail=0
          for report in \
            library/resource-exec-tor-gpl/build/reports/resource-validation/resource-exec-tor-gpl/jvm.err \
            library/resource-lib-tor-gpl/build/reports/resource-validation/resource-lib-tor-gpl/jvm.err \
            library/resource-geoip/build/reports/resource-validation/resource-geoip/jvm-geoip.err; do
            if [ ! -f "$report" ]; then echo "::error::$report was not written"; fail=1; fi
          done
          for report in $(find library -path '*/build/reports/resource-validation/*' -name '*.err' | sort); do
            if [ -s "$report" ]; then
              echo "::error::$report is not empty:"
              cat "$report"
              fail=1
            else
              echo "$report: OK"
            fi
          done
          if ! grep -q 'Tor 0.4.9.16 running on Linux' test-linux/build/test-results/jvmTest/*.xml; then
            echo "::error::test-linux didn't run the packaged tor"
            fail=1
          fi
          exit "$fail"

      # The jars are reproducible (fixed timestamps, entry order and entry modes; publication.gradle.kts), so a
      # rebuild from this run's `package` artifact must give these jar hashes (docs/RELEASING.md).
      - name: Record Hashes
        run: |
          {
            echo "### Packaged resources"
            echo '```'
            (cd external/build/package && find . -name '*.gz' | sort | xargs sha256sum | sed 's#  \./#  #')
            echo '```'
            echo "### JVM jars"
            echo '```'
            sha256sum library/*/build/libs/*-jvm-*.jar | sed 's#  library/.*/build/libs/#  #'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Packaged Resources And Jars
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            external/build/package/
            library/*/build/libs/*.jar
          if-no-files-found: error
